<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="login.css">
    <title>RU Adiantado - Login</title>
</head>
<body>
    <div id="loginBox">
        <h1>Adiantado - Login</h1>
        <form id="loginForm">
            
            <div id="inputRow">
                <label style="font-size: 21px;">Usuário:</label>
                <input type="text" id="usuario" required placeholder="Usuario" style=" font-size: 18px;">
            </div>

            <div id="inputRow">
                <label style="font-size: 21px;">Senha:</label>
                <input type="password" id="senha" required placeholder="Senha" style=" font-size: 18px;">
            </div>

            <button id="submitButton">Entrar</button>
        </form>
        <p id="mensagem"></p>
    </div>
</body>
</html>
